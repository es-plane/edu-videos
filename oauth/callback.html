<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok OAuth callback</title>
<style>
body{font-family:sans-serif;background:#0b1020;color:#e2e8f0;max-width:720px;margin:40px auto;padding:24px}
code,pre{background:#111827;padding:12px;border-radius:8px;display:block;word-break:break-all}
.ok{color:#86efac}.warn{color:#fbbf24}
</style>
</head>
<body>
<h1>TikTok OAuth</h1>
<p id="msg">Reading code…</p>
<pre id="out"></pre>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code');
const state = q.get('state');
const err = q.get('error');
const el = document.getElementById('msg');
const out = document.getElementById('out');
if (err) {
  el.className = 'warn';
  el.textContent = 'Error: ' + err + ' ' + (q.get('error_description') || '');
} else if (code) {
  el.className = 'ok';
  el.textContent = 'Authorization code received. You can close this tab after the agent saves the token.';
  out.textContent = 'code=' + code + '\nstate=' + (state || '');
} else {
  el.textContent = 'No code in URL. Expected redirect from TikTok authorize.';
}
</script>
</body>
</html>
